<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>チェキメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    /* 正本トークン（CLAUDE.md §6.1） */
    --bg:#F7F8FC; --bg2:#EEF4FF; --panel:#DCE9FF;
    --crystal:#CFEFFF; --crystal2:#DFF7FF; --reflect:#E6F5FF;
    --accent:#7FA8E8; --accent-d:#5A84C9;
    --ink:#1E2633; --muted:#6E7787; --line:#DCE9FF;
    --serif:"Shippori Mincho",serif;
    --sans:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:var(--sans); color:var(--ink); margin:0; min-height:100dvh;
    background:radial-gradient(46% 32% at 90% -4%,var(--crystal2),transparent 70%),var(--bg);
    display:grid; place-items:start center; padding:28px 18px;
  }
  .app{ width:min(900px,100%); }
  h1{ font-family:var(--serif); font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:.03em; }
  .lead{ font-family:"Noto Sans JP",sans-serif; font-size:12px; color:var(--muted); margin:0 0 20px; }
  .lead + .lead{ margin-top:-12px; }
  /* 見出しと言語切替を横並び。狭い画面では切替が下に回り込む */
  .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px 16px; flex-wrap:wrap; }
  /* 言語切替：主役（チェキを作る）と競わないよう、線だけの控えめな2択 */
  .lang{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; flex-shrink:0; }
  .lang button{ border:0; border-radius:0; min-width:72px; padding:10px 12px; font-size:12px; color:var(--muted); }
  .lang button + button{ border-left:1px solid var(--line); }
  .lang button[aria-pressed="true"]{ background:var(--bg2); color:var(--ink); font-weight:600; }
  .lang button:focus-visible{ outline:2px solid var(--accent-d); outline-offset:-2px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 8px 24px rgba(30,38,51,.05); }
  .row{ display:flex; gap:24px; flex-wrap:wrap; }
  .col{ flex:1 1 300px; }
  label{ font-size:12px; color:var(--muted); display:block; }
  input[type="file"], input[type="text"]{
    width:100%; margin-top:6px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--line); background:var(--reflect); color:var(--ink);
    font-family:inherit; font-size:13px;
  }
  .field{ margin-top:14px; }
  .accent{ display:flex; flex-wrap:wrap; gap:0; margin:4px 0 0 -7px; }
  /* 押せる範囲は44px、見える丸は30pxのまま */
  .swatch{ width:44px; height:44px; padding:0; border:0; border-radius:50%; background:transparent; display:grid; place-items:center; }
  .swatch:hover{ background:transparent; }
  .swatch::before{ content:""; width:30px; height:30px; border-radius:50%; background:var(--sw); border:2px solid #fff; box-shadow:0 0 0 1px var(--line); box-sizing:border-box; }
  .swatch.pearl::before{ box-shadow:0 0 0 1px #C9CDD3; }   /* 白は台紙に溶けないよう薄いグレーの縁 */
  .swatch[aria-pressed="true"]::before{ box-shadow:0 0 0 2px var(--accent-d); }
  .swatch:focus-visible{ outline:2px solid var(--accent-d); outline-offset:-2px; }
  .btns{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  button{
    font-family:var(--sans); font-size:13px; padding:10px 16px; min-height:44px; border-radius:12px;
    border:1px solid var(--line); cursor:pointer; transition:.15s; background:#fff; color:var(--ink);
  }
  /* 白文字のAA（4.5:1以上）を満たすため、主ボタンは濃いアクセント #4A73B8（4.7:1） */
  button.primary{ background:#4A73B8; border-color:#4A73B8; color:#fff; font-weight:600; box-shadow:0 6px 16px rgba(74,115,184,.24); }
  button:hover{ background:var(--reflect); }
  button.primary:hover{ filter:brightness(.98); background:#4A73B8; }
  .tip{ font-family:"Noto Sans JP",sans-serif; font-size:11px; color:var(--muted); margin-top:10px; }
  .stage{ display:grid; place-items:center; margin-top:18px; }
  canvas{ max-width:100%; border-radius:12px; box-shadow:0 10px 30px rgba(30,38,51,.10); }
</style>
</head>
<body>
  <div class="app">
    <div class="head">
      <h1 data-i18n="title">チェキメーカー</h1>
      <!-- 言語切替：各ボタンはその言語自身の表記（読めない言語でも自分の言語は見つけられる） -->
      <div class="lang" id="lang" role="group" aria-label="言語 / Language">
        <button type="button" data-lang="ja" lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <p class="lead" data-i18n="lead">画像とひとことを入れるだけ。静かな水色のチェキ風PNGにして保存できる。画像と入力内容は端末内で処理し、外部へ送信しません。表示用フォントはGoogle Fontsから取得します。</p>
    <p class="lead" data-i18n="about" hidden></p>

    <div class="card">
      <div class="row">
        <div class="col">
          <label><span data-i18n="fileLabel">画像を選ぶ</span>
            <input id="file" type="file" accept="image/*" aria-describedby="file-status" />
          </label>
          <p class="tip" id="file-status" role="status"></p>
          <div class="field">
            <label><span data-i18n="captionLabel">ひとこと（推しの名前・日付・会場など）</span>
              <input id="caption" type="text" maxlength="64" placeholder="" aria-describedby="caption-tip" />
            </label>
            <p class="tip" id="caption-tip" data-i18n="captionTip">入力は最大64文字。2行に収まらない部分は「…」で省略されます。</p>
          </div>
          <div class="field">
            <label id="accent-label" data-i18n="accentLabel">アクセント</label>
            <div class="accent" id="accent" role="group" aria-labelledby="accent-label">
              <button type="button" class="swatch" aria-pressed="true" data-c="#5A84C9" data-name="blue" style="--sw:#7FA8E8" title="青" aria-label="青"></button>
              <button type="button" class="swatch" aria-pressed="false" data-c="#7FA8E8" data-name="crystal" style="--sw:#CFEFFF" title="クリスタル水色" aria-label="クリスタル水色"></button>
              <button type="button" class="swatch" aria-pressed="false" data-c="#9AA6B4" data-name="silver" style="--sw:#D9D9D9" title="シルバー" aria-label="シルバー"></button>
              <button type="button" class="swatch" aria-pressed="false" data-c="#C98A9A" data-name="pink" style="--sw:#EBCBD3" title="くすみピンク" aria-label="くすみピンク"></button>
              <button type="button" class="swatch" aria-pressed="false" data-c="#B7AEE9" data-name="lavender" style="--sw:#CFC9F6" title="ラベンダー" aria-label="ラベンダー"></button>
              <button type="button" class="swatch pearl" aria-pressed="false" data-c="#F4F2EE" data-edge="#C9CDD3" data-name="pearl" style="--sw:#FAFAFA" title="パールホワイト" aria-label="パールホワイト"></button>
            </div>
          </div>
          <div class="btns">
            <button class="primary" id="render" data-i18n="render">チェキを作る</button>
            <button id="save" data-i18n="save">PNGで保存</button>
            <button id="print" data-i18n="print">印刷用に保存（大）</button>
            <button id="clear" data-i18n="clear">リセット</button>
          </div>
          <div class="tip" id="print-status" role="status"></div>
          <div class="tip" data-i18n="sizeTip">画面 720×900px。「印刷用に保存（大）」は同じ見た目を 2160×2700px（小カードなら300dpi以上）で書き出します。見出し・ひとことは明朝（Shippori Mincho）。</div>
        </div>
      </div>
      <div class="stage"><canvas id="c" width="720" height="900" aria-label="チェキ出力" data-i18n-label="canvas"></canvas></div>
    </div>
  </div>

<script>
// ===== 日英の文言（直訳ではなく、海外の推し活ファンに伝わる言い方にしている） =====
const I18N = {
  ja: {
    docTitle: "チェキメーカー",
    title: "チェキメーカー",
    lead: "画像とひとことを入れるだけ。静かな水色のチェキ風PNGにして保存できる。画像と入力内容は端末内で処理し、外部へ送信しません。表示用フォントはGoogle Fontsから取得します。",
    about: "",
    fileLabel: "画像を選ぶ",
    captionLabel: "ひとこと（推しの名前・日付・会場など）",
    captionTip: "入力は最大64文字。2行に収まらない部分は「…」で省略されます。",
    accentLabel: "アクセント",
    render: "チェキを作る",
    save: "PNGで保存",
    print: "印刷用に保存（大）",
    clear: "リセット",
    sizeTip: "画面 720×900px。「印刷用に保存（大）」は同じ見た目を 2160×2700px（小カードなら300dpi以上）で書き出します。見出し・ひとことは明朝（Shippori Mincho）。",
    canvas: "チェキ出力",
    loading: "画像を読み込み中…",
    loadError: "画像を読み込めませんでした。別の画像を選んでください。",
    printError: "印刷用PNGを保存できませんでした。通常のPNG保存をお試しください。",
    colors: { blue:"青", crystal:"クリスタル水色", silver:"シルバー", pink:"くすみピンク", lavender:"ラベンダー", pearl:"パールホワイト" },
  },
  en: {
    docTitle: "Cheki Maker — pale-blue instant photo cards",
    title: "Cheki Maker",
    lead: "Add a photo and a short caption, and save it as a calm, pale-blue instant-photo card (PNG). Your photo and text stay on your device and are never uploaded. Only the display fonts are loaded from Google Fonts.",
    about: "“Cheki” is what fans in Japan call instant photos — like the ones you take with your oshi (the idol, character or creator you support) at events. Make your own as a keepsake.",
    fileLabel: "Choose a photo",
    captionLabel: "Caption (your oshi’s name, the date, the venue…)",
    captionTip: "Up to 64 characters. Anything that doesn’t fit on two lines is cut off with “…”.",
    accentLabel: "Accent color",
    render: "Make my cheki",
    save: "Save PNG",
    print: "Save for print (large)",
    clear: "Reset",
    sizeTip: "Screen size: 720×900 px. “Save for print” exports the same design at 2160×2700 px (300 dpi or more for small cards). The caption is set in Shippori Mincho, a Japanese serif typeface.",
    canvas: "Cheki preview",
    loading: "Loading photo…",
    loadError: "Couldn’t load this image. Please choose another one.",
    printError: "Couldn’t save the print-size PNG. Please try “Save PNG” instead.",
    colors: { blue:"Blue", crystal:"Crystal blue", silver:"Silver", pink:"Dusty pink", lavender:"Lavender", pearl:"Pearl white" },
  },
};
let lang = "ja";
const t = (k) => I18N[lang][k];

// 初期言語：URLの ?lang= ＞ 前回選んだ言語 ＞ ブラウザの言語（日本語以外なら英語）
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ja" || q === "en") return q;
  try { const s = localStorage.getItem("cheki-lang"); if (s === "ja" || s === "en") return s; } catch {}
  return (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
}

function applyLang(next) {
  lang = next;
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach((n) => {
    const v = t(n.dataset.i18n);
    n.textContent = v;
    n.hidden = !v;   // 日本語では不要な説明（チェキ・推しの解説）は隠す
  });
  document.querySelectorAll("[data-i18n-label]").forEach((n) => n.setAttribute("aria-label", t(n.dataset.i18nLabel)));
  document.querySelectorAll("#accent .swatch").forEach((b) => {
    const name = t("colors")[b.dataset.name];
    b.title = name; b.setAttribute("aria-label", name);
  });
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("cheki-lang", lang); } catch {}
}

const W = 720, H = 900;
const PAD = 26, INNER = 30, CAP_H = 150, FRAME_R = 26, PHOTO_R = 14;
const COL = { back:"#EEF4FF", paper:"#FFFFFF", photoBg:"#E6F5FF", ink:"#1E2633", date:"#9aa6b4" };
let accentLine = "#5A84C9";   // 罫線・点の色（正本アクセント青）
let accentEdge = null;        // 白など淡い色のときだけ付ける縁の色
let img = null;
let imageRequest = 0;

const screenCtx = document.querySelector("#c").getContext("2d");
let ctx = screenCtx;   // 印刷書き出し時だけ一時的に高解像度キャンバスへ差し替える
const el = {
  file: document.querySelector("#file"),
  fileStatus: document.querySelector("#file-status"),
  cap: document.querySelector("#caption"),
  render: document.querySelector("#render"),
  save: document.querySelector("#save"),
  print: document.querySelector("#print"),
  printStatus: document.querySelector("#print-status"),
  clear: document.querySelector("#clear"),
  accent: document.querySelector("#accent"),
};

el.file.addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const request = ++imageRequest;
  img = null;
  el.fileStatus.textContent = t("loading");
  el.save.disabled = el.print.disabled = true;
  draw();
  try {
    const loaded = await fileToImage(f);
    if (request !== imageRequest) return;
    img = loaded;
    draw();
    el.fileStatus.textContent = "";
  } catch {
    if (request !== imageRequest) return;
    img = null;
    el.file.value = "";
    el.fileStatus.textContent = t("loadError");
    draw();
  } finally {
    if (request === imageRequest) el.save.disabled = el.print.disabled = false;
  }
});
el.render.addEventListener("click", draw);
el.save.addEventListener("click", savePNG);
el.print.addEventListener("click", () => exportPrint(3));
el.clear.addEventListener("click", () => {
  ++imageRequest;
  img = null; el.file.value = ""; el.cap.value = "";
  el.fileStatus.textContent = "";
  el.printStatus.textContent = "";
  el.save.disabled = el.print.disabled = false;
  draw();
});
el.cap.addEventListener("input", draw);
document.querySelector("#lang").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (b) applyLang(b.dataset.lang);   // 画面の文字だけ切り替える。作ったチェキの絵は変えない
});
el.accent.addEventListener("click", (e) => {
  const sw = e.target.closest(".swatch");
  if (!sw) return;
  [...el.accent.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  sw.setAttribute("aria-pressed", "true");
  accentLine = sw.getAttribute("data-c");
  accentEdge = sw.getAttribute("data-edge");
  draw();
});

function draw() {
  baseFrame();
  if (img) placePhoto(img);
  drawCaption(el.cap.value || "");
  addGrain(0.028);
}

function baseFrame() {
  ctx.clearRect(0, 0, W, H);
  // 明るい霧の背景
  ctx.fillStyle = COL.back;
  ctx.fillRect(0, 0, W, H);

  // 白いチェキ紙（弱い影）
  ctx.save();
  ctx.shadowColor = "rgba(30,38,51,0.12)";
  ctx.shadowBlur = 28; ctx.shadowOffsetY = 12;
  roundRect(PAD, PAD, W - PAD * 2, H - PAD * 2, FRAME_R);
  ctx.fillStyle = COL.paper; ctx.fill();
  ctx.restore();

  // 画像エリア（下にひとこと用の余白を残す＝ポラロイドらしさ）
  const x = PAD + INNER, y = PAD + INNER;
  const w = W - (PAD + INNER) * 2;
  const h = H - (PAD + INNER) * 2 - CAP_H;
  roundRect(x, y, w, h, PHOTO_R);
  ctx.fillStyle = COL.photoBg; ctx.fill();
}

function placePhoto(image) {
  const x = PAD + INNER, y = PAD + INNER;
  const w = W - (PAD + INNER) * 2;
  const h = H - (PAD + INNER) * 2 - CAP_H;
  const r = Math.max(w / image.width, h / image.height);
  const dw = image.width * r, dh = image.height * r;
  const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;

  ctx.save();
  roundRect(x, y, w, h, PHOTO_R); ctx.clip();
  ctx.drawImage(image, dx, dy, dw, dh);
  // ごく薄い寒色トーン（水色の世界観に馴染ませる・弱め）
  ctx.fillStyle = "rgba(127,168,232,0.08)";
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function drawCaption(text) {
  const x = PAD + INNER;
  const boxY = H - PAD - INNER - CAP_H;
  const w = W - (PAD + INNER) * 2;

  // 細い罫線＋小さなアクセント点
  const lineY = boxY + 10;
  if (accentEdge) {
    // 白い罫線が台紙に溶けないよう、下に薄いグレーの縁を敷く
    ctx.strokeStyle = accentEdge; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(x, lineY); ctx.lineTo(x + w, lineY); ctx.stroke();
  }
  ctx.strokeStyle = accentLine; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, lineY); ctx.lineTo(x + w, lineY); ctx.stroke();
  ctx.fillStyle = accentLine;
  ctx.beginPath(); ctx.arc(x + 8, lineY, 3.5, 0, Math.PI * 2); ctx.fill();
  if (accentEdge) {
    ctx.strokeStyle = accentEdge; ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ひとこと（明朝・世界観の核）。1行に収まらなければ少し小さくして2行まで折り返す
  const maxW = w - 8;
  ctx.fillStyle = COL.ink;
  ctx.textBaseline = "top";
  const t = (text || "").trim();
  ctx.font = '700 30px "Shippori Mincho", serif';
  let dateY = boxY + 80;
  if (ctx.measureText(t).width <= maxW) {
    ctx.fillText(t, x + 4, boxY + 28);
  } else {
    ctx.font = '700 26px "Shippori Mincho", serif';
    const lines = wrapLines(t, maxW, 2);
    lines.forEach((ln, i) => ctx.fillText(ln, x + 4, boxY + 24 + i * 38));
    dateY = boxY + 104;
  }

  // 日付（控えめ）
  ctx.font = '14px "Noto Sans JP", system-ui, sans-serif';
  ctx.fillStyle = COL.date;
  ctx.fillText(localDate(), x + 4, dateY);
}

// 日付は端末の地域時刻で「年-月-日」（国によって月/日の順が逆になる誤読を避けるため数字順は固定）
function localDate(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// 幅を測って折り返す。英語などは単語の途中で切らず空白で折り返し、
// 日本語のように空白の無い文や長すぎる単語は1文字単位で折る。入りきらない分は「…」で示す
function wrapLines(text, maxW, maxLines) {
  const units = [];
  for (const tok of text.match(/\S+\s*|\s+/g) || []) {
    if (ctx.measureText(tok.trimEnd()).width <= maxW) units.push(tok);
    else units.push(...[...tok]);
  }
  const lines = [];
  let cur = "";
  for (let i = 0; i < units.length; i++) {
    const next = cur + units[i];
    if (ctx.measureText(next.trimEnd()).width <= maxW) { cur = next; continue; }
    if (lines.length === maxLines - 1) {
      cur = next;
      while (cur && ctx.measureText(cur.trimEnd() + "…").width > maxW) cur = [...cur].slice(0, -1).join("");
      lines.push(cur.trimEnd() + "…");
      return lines;
    }
    if (cur) lines.push(cur.trimEnd());
    cur = units[i].trimStart();
  }
  if (cur) lines.push(cur.trimEnd());
  return lines;
}

function addGrain(strength) {
  // キャンバスの実ピクセル寸法で処理（印刷用の高解像度キャンバスにも対応）
  const cw = ctx.canvas.width, ch = ctx.canvas.height;
  const d = ctx.getImageData(0, 0, cw, ch);
  const a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const n = (Math.random() * 2 - 1) * 255 * strength;
    a[i] += n; a[i + 1] += n; a[i + 2] += n;
  }
  ctx.putImageData(d, 0, 0);
}

function savePNG() {
  const a = document.createElement("a");
  a.download = "cheki.png";
  a.href = document.querySelector("#c").toDataURL("image/png");
  a.click();
}

// 印刷用：同じ絵をそのまま scale 倍の高解像度で書き出す（見た目は変えない）
function exportPrint(scale = 3) {
  const prev = ctx;
  el.printStatus.textContent = "";
  try {
    const oc = document.createElement("canvas");
    oc.width = W * scale; oc.height = H * scale;
    ctx = oc.getContext("2d");   // 一時的に描画先を高解像度キャンバスへ
    if (!ctx) throw new Error("印刷用Canvasを作成できませんでした");
    ctx.scale(scale, scale);
    draw();
    const url = oc.toDataURL("image/png");
    if (!url.startsWith("data:image/png;base64,")) throw new Error("PNGを作成できませんでした");
    const a = document.createElement("a");
    a.download = "cheki_print.png";
    a.href = url;
    a.click();
  } catch {
    el.printStatus.textContent = t("printError");
  } finally {
    ctx = prev;   // 成否にかかわらず画面用に戻す。プレビューは再描画しない
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fileToImage(file) {
  return new Promise((res, rej) => {
    const im = new Image();
    const url = URL.createObjectURL(file);
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    im.src = url;
  });
}
